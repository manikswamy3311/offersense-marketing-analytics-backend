---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: offersense

---
# ConfigMap for application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: offersense-config
  namespace: offersense
data:
  LOG_LEVEL: "WARNING"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"

---
# Secret for sensitive data
apiVersion: v1
kind: Secret
metadata:
  name: offersense-secrets
  namespace: offersense
type: Opaque
data:
  # Base64 encoded values - replace with your actual values
  secret-key: eW91ci1zZWNyZXQta2V5LWhlcmU=
  db-password: eW91ci1kYi1wYXNzd29yZA==
  redis-password: cmVkaXMtcGFzc3dvcmQ=

---
# Persistent Volume Claim for database
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: offersense-db-pvc
  namespace: offersense
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard

---
# Persistent Volume Claim for logs
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: offersense-logs-pvc
  namespace: offersense
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard

---
# Service for API
apiVersion: v1
kind: Service
metadata:
  name: offersense-api-service
  namespace: offersense
spec:
  selector:
    app: offersense-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
      name: http
  type: ClusterIP

---
# Service for Database
apiVersion: v1
kind: Service
metadata:
  name: offersense-db-service
  namespace: offersense
spec:
  selector:
    app: offersense-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP

---
# Deployment for API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: offersense-api
  namespace: offersense
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: offersense-api
  template:
    metadata:
      labels:
        app: offersense-api
    spec:
      containers:
      - name: api
        image: offersense-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: offersense-config
              key: LOG_LEVEL
        - name: API_HOST
          valueFrom:
            configMapKeyRef:
              name: offersense-config
              key: API_HOST
        - name: API_PORT
          valueFrom:
            configMapKeyRef:
              name: offersense-config
              key: API_PORT
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: offersense-secrets
              key: secret-key
        - name: DATABASE_URL
          value: "postgresql://offersense:$(DB_PASSWORD)@offersense-db-service:5432/offersense"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: offersense-secrets
              key: db-password
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: logs
        persistentVolumeClaim:
          claimName: offersense-logs-pvc

---
# StatefulSet for Database
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: offersense-db
  namespace: offersense
spec:
  serviceName: offersense-db-service
  replicas: 1
  selector:
    matchLabels:
      app: offersense-db
  template:
    metadata:
      labels:
        app: offersense-db
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: offersense
        - name: POSTGRES_USER
          value: offersense
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: offersense-secrets
              key: db-password
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
          subPath: postgres
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: standard
      resources:
        requests:
          storage: 10Gi

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: offersense-api-hpa
  namespace: offersense
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: offersense-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# Ingress for routing
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: offersense-ingress
  namespace: offersense
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - api.yourdomain.com
    secretName: offersense-tls
  rules:
  - host: api.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: offersense-api-service
            port:
              number: 80
