version: '3.9'

services:
  # Production FastAPI Backend
  api:
    image: offersense-api:latest
    container_name: offersense-api-prod
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=WARNING
      - DATABASE_URL=postgresql://offersense:secure_password@db:5432/offersense
    depends_on:
      db:
        condition: service_healthy
    networks:
      - offersense-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    expose:
      - "8000"
    volumes:
      - ./logs:/app/logs

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: offersense-db
    restart: always
    environment:
      POSTGRES_USER: offersense
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: offersense
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backup:/backup
    networks:
      - offersense-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offersense"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"  # Only expose for backup/admin purposes

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: offersense-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - api
    networks:
      - offersense-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Redis Cache
  redis:
    image: redis:7-alpine
    container_name: offersense-redis
    restart: always
    command: redis-server --appendonly yes --requirepass redis_password
    volumes:
      - redis_data:/data
    networks:
      - offersense-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    expose:
      - "6379"

  # Optional: Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: offersense-prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - offersense-network
    expose:
      - "9090"

  # Optional: Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: offersense-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - offersense-network
    ports:
      - "3000:3000"

networks:
  offersense-network:
    driver: bridge

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
