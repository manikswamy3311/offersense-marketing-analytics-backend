version: '3.9'

services:
  # Main FastAPI Backend Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: offersense-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
      - /app/__pycache__
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - offersense-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Optional: SQLite Database Volume (for persistence)
  # In production, consider using PostgreSQL or MySQL
  db:
    image: alpine:latest
    container_name: offersense-db
    volumes:
      - db_data:/app/data
    command: tail -f /dev/null  # Keep container running
    networks:
      - offersense-network

networks:
  offersense-network:
    driver: bridge

volumes:
  db_data:
    driver: local
